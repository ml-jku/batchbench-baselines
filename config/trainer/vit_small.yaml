defaults:
  - model: vit_small
  - optimizer: adamw
  - scheduler: warmup_cosine
  - _self_

_target_: training.methods.erm.Trainer

gradient_accumulation_steps: 1
device: ${oc.env:JUMPCP_DEVICE,auto}
no_amp: false
max_train_batches: null
output: models/vit_small.pt

# DeiT-style defaults for training a ViT from scratch; lr, weight decay,
# drop_path_rate and patch_size are the best vit-small-sweep config (run
# cab7z7dp, blooming-sweep-12: validation accuracy 0.3517 on source_2).
label_smoothing: 0.1
grad_clip_norm: 1.0   # 0 or null disables clipping

optimizer:
  _convert_: all
  lr: 0.0003030524920219198
  weight_decay: 0.13765297772861698
  betas: [0.9, 0.999]
